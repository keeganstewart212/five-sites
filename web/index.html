<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Five Sites · Community battery shortlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">Community battery shortlist</p>
      <h1>Five Sites</h1>
    </header>

    <section id="choose" hidden>
      <h2>Choose a risk profile</h2>
      <p class="lede">How much uncertainty are you comfortable with when choosing which sites to evaluate?</p>
      <div id="profiles" class="profiles"></div>
    </section>

    <section id="results" hidden>
      <button id="back" class="back" type="button">← Switch risk profile</button>
      <h2 id="results-title"></h2>
      <p id="results-sub" class="lede"></p>
      <ol id="cards" class="cards"></ol>
    </section>

    <p id="error" class="error" hidden></p>
    <footer id="footer" class="footer"></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
